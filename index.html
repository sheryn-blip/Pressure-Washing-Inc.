<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pressure Washing Instant Quote</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; line-height: 1.6; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    .quote-box { background: #f4f4f4; padding: 15px; border-left: 5px solid #007bff; margin: 20px 0; font-size: 1.2rem; }
    button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <h2>Get an Instant Pressure Washing Estimate</h2>

  <form id="quoteForm" action="https://api.web3forms.com/submit" method="POST">
    <!-- Replace YOUR_ACCESS_KEY_HERE with your Web3Forms access key -->
    <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
    <input type="hidden" name="subject" value="New Pressure Washing Quote Request">
    <input type="hidden" id="calculatedQuote" name="Calculated_Quote" value="$150.00">

    <div class="form-group">
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="Customer_Name" required>
    </div>

    <div class="form-group">
      <label for="email">Your Email:</label>
      <input type="email" id="email" name="Customer_Email" required>
    </div>

    <div class="form-group">
      <label for="house">House (sq ft) - $0.15/sq ft:</label>
      <input type="number" id="house" min="0" value="0" oninput="calculateTotal()">
    </div>

    <div class="form-group">
      <label for="driveway">Driveway (sq ft) - $0.12/sq ft:</label>
      <input type="number" id="driveway" min="0" value="0" oninput="calculateTotal()">
    </div>

    <div class="form-group">
      <label for="deck">Deck (sq ft) - $0.30/sq ft:</label>
      <input type="number" id="deck" min="0" value="0" oninput="calculateTotal()">
    </div>

    <div class="form-group">
      <label for="fence">Fence (linear ft) - $1.00/linear ft:</label>
      <input type="number" id="fence" min="0" value="0" oninput="calculateTotal()">
    </div>

    <div class="quote-box">
      <strong>Estimated Total: </strong><span id="displayTotal">$150.00</span>
      <small style="display:block; color:#666;">(Minimum job cost: $150)</small>
    </div>

    <button type="submit">Submit & Request Service</button>
  </form>

  <script>
    function calculateTotal() {
      const houseSqFt = parseFloat(document.getElementById('house').value) || 0;
      const drivewaySqFt = parseFloat(document.getElementById('driveway').value) || 0;
      const deckSqFt = parseFloat(document.getElementById('deck').value) || 0;
      const fenceLinearFt = parseFloat(document.getElementById('fence').value) || 0;

      const subtotal = (houseSqFt * 0.15) + (drivewaySqFt * 0.12) + (deckSqFt * 0.30) + (fenceLinearFt * 1.00);
      const total = Math.max(150, subtotal);

      const formattedTotal = `$${total.toFixed(2)}`;
      document.getElementById('displayTotal').innerText = formattedTotal;
      document.getElementById('calculatedQuote').value = formattedTotal;
    }
  </script>
</body>
</html>
